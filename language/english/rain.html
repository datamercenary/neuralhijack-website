<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alphabet Rain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    :root {
      --rain-bg: rgb(33, 40, 37);
      --rain-text: rgb(147, 209, 182);
      --rain-glow: rgb(114, 243, 187);
      --rain-warn: rgb(212, 112, 112);
      --rain-soft: rgba(147, 209, 182, 0.25);
      --rain-keyboard-offset: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      background: var(--rain-bg);
      color: var(--rain-text);
      font-family: "Share Tech Mono", monospace;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    .rain-app {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: clamp(0.75rem, 2vw, 1.5rem);
    }

    .rain-hud {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      right: 0.75rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      z-index: 10;
      pointer-events: none;
    }

    .rain-stat {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.7rem;
      border: 1px solid rgba(147, 209, 182, 0.35);
      background: rgba(18, 25, 24, 0.45);
      color: var(--rain-text);
      text-transform: lowercase;
      letter-spacing: 0.08em;
      font-size: clamp(0.7rem, 1.5vw, 0.9rem);
      box-shadow: 0 0 12px rgba(114, 243, 187, 0.15);
    }

    .rain-stat strong {
      font-weight: 400;
      color: var(--rain-glow);
      text-shadow: 0 0 6px rgba(114, 243, 187, 0.7);
    }

    .rain-play {
      position: relative;
      width: 100%;
      height: calc(100vh - var(--rain-keyboard-offset));
      height: calc(100dvh - var(--rain-keyboard-offset));
      overflow: hidden;
      border: 1px solid rgba(147, 209, 182, 0.24);
      background: rgba(14, 20, 18, 0.4);
      box-shadow: inset 0 0 22px rgba(114, 243, 187, 0.08);
    }

    .rain-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .rain-letter {
      position: absolute;
      left: 0;
      top: -3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.5em;
      color: var(--rain-glow);
      text-shadow: 0 0 8px rgba(114, 243, 187, 0.9);
      user-select: none;
      will-change: transform;
      font-weight: 400;
      text-transform: lowercase;
    }

    .rain-letter.hit {
      opacity: 0;
      transform: scale(1.4);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    @media (max-width: 600px) {
      .rain-app {
        padding: 0.5rem;
      }

      .rain-hud {
        top: 0.5rem;
        left: 0.5rem;
        right: 0.5rem;
      }

      .rain-play {
        border-width: 1px;
      }
    }
  </style>
</head>
<body>
  <div class="rain-app">
    <div class="rain-hud" aria-live="polite">
      <div class="rain-stat"><span>score</span><strong id="score">0</strong></div>
      <div class="rain-stat"><span>misses</span><strong id="misses">0</strong></div>
    </div>

    <div id="rain-play" class="rain-play" aria-label="Alphabet rain game area">
      <div id="rain-layer" class="rain-layer" aria-hidden="true"></div>
    </div>
  </div>

  <div id="interlaced"></div>
  <div id="glare"></div>

  <script>
    const alphabet = 'abcdefghijklmnopqrstuvwxyz'.split('');
    const gameArea = document.getElementById('rain-play');
    const layer = document.getElementById('rain-layer');
    const scoreEl = document.getElementById('score');
    const missesEl = document.getElementById('misses');

    const state = {
      letters: [],
      score: 0,
      misses: 0,
      nextSpawnAt: 0,
      lastFrame: 0,
      spawnCooldown: 550,
      keyboardOffset: 0
    };

    function setKeyboardOffset() {
      const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
      const touchDevice = navigator.maxTouchPoints > 0;
      const hasPhysicalKeyboard = !(coarsePointer || touchDevice);
      state.keyboardOffset = hasPhysicalKeyboard ? 0 : 220;
      document.documentElement.style.setProperty('--rain-keyboard-offset', `${state.keyboardOffset}px`);
      gameArea.style.height = `calc(100vh - ${state.keyboardOffset}px)`;
      gameArea.style.height = `calc(100dvh - ${state.keyboardOffset}px)`;
      return state.keyboardOffset;
    }

    function updateHud() {
      scoreEl.textContent = String(state.score);
      missesEl.textContent = String(state.misses);
    }

    function spawnLetter() {
      const letter = alphabet[Math.floor(Math.random() * alphabet.length)];
      const size = 22 + Math.random() * 22;
      const element = document.createElement('div');
      element.className = 'rain-letter';
      element.textContent = letter;
      element.style.fontSize = `${size}px`;
      element.style.left = `${Math.random() * Math.max(16, gameArea.clientWidth - size * 1.4)}px`;
      element.style.top = `${-size}px`;

      const record = {
        letter,
        element,
        x: parseFloat(element.style.left),
        y: -size,
        speed: 42 + Math.random() * 40,
        size
      };

      layer.appendChild(element);
      state.letters.push(record);
    }

    function removeLetter(record) {
      record.element.classList.add('hit');
      window.setTimeout(() => {
        record.element.remove();
      }, 180);
      state.letters = state.letters.filter(item => item !== record);
    }

    function onMiss(record) {
      if (!record) return;
      state.misses += 1;
      updateHud();
      removeLetter(record);
    }

    function tick(now) {
      if (!state.lastFrame) state.lastFrame = now;
      const delta = Math.min((now - state.lastFrame) / 1000, 0.05);
      state.lastFrame = now;

      if (now >= state.nextSpawnAt) {
        spawnLetter();
        state.nextSpawnAt = now + state.spawnCooldown * (0.8 + Math.random() * 0.8);
      }

      const activeLetters = [];
      for (const record of state.letters) {
        record.y += record.speed * delta;
        record.element.style.top = `${record.y}px`;

        if (record.y > gameArea.clientHeight + record.size) {
          onMiss(record);
        } else {
          activeLetters.push(record);
        }
      }
      state.letters = activeLetters;

      requestAnimationFrame(tick);
    }

    function handleTyping(event) {
      const key = event.key ? event.key.toLowerCase() : '';
      if (!/^[a-z]$/.test(key)) return;
      event.preventDefault();

      const matching = state.letters
        .filter(record => record.letter === key)
        .sort((a, b) => b.y - a.y);

      if (!matching.length) return;

      const target = matching[0];
      state.score += 1;
      updateHud();
      removeLetter(target);
    }

    window.addEventListener('keydown', handleTyping);
    window.addEventListener('resize', () => {
      setKeyboardOffset();
    });

    setKeyboardOffset();
    updateHud();
    state.nextSpawnAt = 0;
    requestAnimationFrame(tick);
  </script>
</body>
</html>
