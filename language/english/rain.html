<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alphabet Rain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    :root {
      --rain-bg: rgb(33, 40, 37);
      --rain-text: rgb(147, 209, 182);
      --rain-glow: rgb(114, 243, 187);
      --rain-warn: rgb(212, 112, 112);
      --rain-soft: rgba(147, 209, 182, 0.25);
      --rain-keyboard-offset: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      background: var(--rain-bg);
      color: var(--rain-text);
      font-family: "Share Tech Mono", monospace;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    .rain-app {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: clamp(0.75rem, 2vw, 1.5rem);
    }

    .rain-hud {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      right: 0.75rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      z-index: 10;
      pointer-events: none;
    }

    .rain-stat {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0;
      color: var(--rain-text);
      text-transform: lowercase;
      letter-spacing: 0.08em;
      font-size: 1.5rem;
    }

    .rain-stat strong {
      font-weight: 400;
      color: var(--rain-glow);
      text-shadow: 0 0 6px rgba(114, 243, 187, 0.7);
    }

    .rain-play {
      position: relative;
      width: 100%;
      height: calc(100vh - var(--rain-keyboard-offset));
      height: calc(100dvh - var(--rain-keyboard-offset));
      overflow: hidden;
      background: rgba(14, 20, 18, 0.4);
      box-shadow: inset 0 0 22px rgba(114, 243, 187, 0.08);
    }

    .rain-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .rain-letter {
      position: absolute;
      left: 0;
      top: -3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.5em;
      color: var(--rain-glow);
      text-shadow: 0 0 8px rgba(114, 243, 187, 0.9);
      user-select: none;
      font-weight: 400;
      text-transform: lowercase;
      line-height: 1;
      font-size: 34px;
    }

    .rain-letter.hit {
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    @media (max-width: 600px) {
      .rain-app {
        padding: 0.5rem;
      }

      .rain-hud {
        top: 0.5rem;
        left: 0.5rem;
        right: 0.5rem;
      }

      .rain-play {
        border: none;
      }
    }
  </style>
</head>
<body>
  <div class="rain-app">
    <div class="rain-hud" aria-live="polite">
      <div class="rain-stat"><span>correct</span><strong id="correct">0</strong></div>
      <div class="rain-stat"><span>wrong</span><strong id="wrong">0</strong></div>
      <div class="rain-stat"><span>misses</span><strong id="misses">0</strong></div>
    </div>

    <div id="rain-play" class="rain-play" aria-label="Alphabet rain game area">
      <div id="rain-layer" class="rain-layer" aria-hidden="true"></div>
    </div>
  </div>

  <div id="interlaced"></div>
  <div id="glare"></div>
  <div id="shell" aria-label="Prompt" style="position:absolute;left:-9999px;top:0;opacity:0;pointer-events:none;overflow:hidden;"></div>

  <script src="../../js/site-map.js"></script>
  <script>
    const alphabet = 'abcdefghijklmnopqrstuvwxyz'.split('');
    const gameArea = document.getElementById('rain-play');
    const layer = document.getElementById('rain-layer');
    const correctEl = document.getElementById('correct');
    const wrongEl = document.getElementById('wrong');
    const missesEl = document.getElementById('misses');

    const state = {
      letters: [],
      correct: 0,
      wrong: 0,
      misses: 0,
      started: false,
      running: false,
      paused: false,
      nextSpawnAt: 0,
      lastFrame: 0,
      spawnCooldown: 650,
      keyboardOffset: 0,
      letterSize: 34,
      fallSpeed: 78,
      pixelStep: 3
    };

    function setKeyboardOffset() {
      const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
      const touchDevice = navigator.maxTouchPoints > 0;
      const hasPhysicalKeyboard = !(coarsePointer || touchDevice);
      state.keyboardOffset = hasPhysicalKeyboard ? 0 : 220;
      document.documentElement.style.setProperty('--rain-keyboard-offset', `${state.keyboardOffset}px`);
      gameArea.style.height = `calc(100vh - ${state.keyboardOffset}px)`;
      gameArea.style.height = `calc(100dvh - ${state.keyboardOffset}px)`;
      return state.keyboardOffset;
    }

    function updateHud() {
      correctEl.textContent = String(state.correct);
      wrongEl.textContent = String(state.wrong);
      missesEl.textContent = String(state.misses);
    }

    function openStartScreen() {
      if (window.NeuralHijackPrompt && typeof window.NeuralHijackPrompt.showScreen === 'function') {
        window.NeuralHijackPrompt.showScreen({
          content: 'Press any lowercase letter or Space to begin.\n\nEsc pauses the game; press Esc again to return home.'
        });
      }
    }

    function closePauseScreen() {
      if (window.NeuralHijackPrompt && typeof window.NeuralHijackPrompt.closeScreen === 'function') {
        window.NeuralHijackPrompt.closeScreen();
      }
    }

    function startGame() {
      state.started = true;
      state.running = true;
      state.paused = false;
      state.lastFrame = 0;
      state.nextSpawnAt = 0;
      closePauseScreen();
      if (window.NeuralHijackPrompt && typeof window.NeuralHijackPrompt.closeScreen === 'function') {
        window.NeuralHijackPrompt.closeScreen();
      }
    }

    function pauseGame() {
      state.running = false;
      state.paused = true;
      if (window.NeuralHijackPrompt && typeof window.NeuralHijackPrompt.showScreen === 'function') {
        window.NeuralHijackPrompt.showScreen({
          content: 'Paused.\n\nPress any lowercase letter or Space to resume.\nPress Esc again to return home.'
        });
      }
    }

    function resumeGame() {
      state.running = true;
      state.paused = false;
      state.lastFrame = 0;
      closePauseScreen();
    }

    function exitGame() {
      window.location.assign(new URL('../../index.html', document.baseURI).href);
    }

    function spawnLetter() {
      const letter = alphabet[Math.floor(Math.random() * alphabet.length)];
      const element = document.createElement('div');
      element.className = 'rain-letter';
      element.textContent = letter;
      const left = Math.random() * Math.max(8, gameArea.clientWidth - state.letterSize * 1.4);
      element.style.left = `${left}px`;
      element.style.top = `${-state.letterSize}px`;
      element.style.fontSize = `${state.letterSize}px`;

      const record = {
        letter,
        element,
        x: left,
        y: -state.letterSize,
        speed: state.fallSpeed,
        size: state.letterSize
      };

      layer.appendChild(element);
      state.letters.push(record);
    }

    function removeLetter(record) {
      record.element.classList.add('hit');
      window.setTimeout(() => {
        record.element.remove();
      }, 180);
      state.letters = state.letters.filter(item => item !== record);
    }

    function onMiss(record) {
      if (!record) return;
      state.misses += 1;
      updateHud();
      removeLetter(record);
    }

    function tick(now) {
      if (!state.running) {
        requestAnimationFrame(tick);
        return;
      }

      if (!state.lastFrame) state.lastFrame = now;
      const delta = Math.min((now - state.lastFrame) / 1000, 0.05);
      state.lastFrame = now;

      if (now >= state.nextSpawnAt) {
        spawnLetter();
        state.nextSpawnAt = now + state.spawnCooldown;
      }

      const activeLetters = [];
      for (const record of state.letters) {
        record.y += record.speed * delta;
        const steppedY = Math.round(record.y / state.pixelStep) * state.pixelStep;
        record.element.style.top = `${steppedY}px`;

        if (record.y > gameArea.clientHeight + record.size) {
          onMiss(record);
        } else {
          activeLetters.push(record);
        }
      }
      state.letters = activeLetters;
      requestAnimationFrame(tick);
    }

    function handleTypedLetter(letter) {
      const matching = state.letters
        .filter(record => record.letter === letter)
        .sort((a, b) => b.y - a.y);

      if (!matching.length) {
        state.wrong += 1;
        updateHud();
        return;
      }

      const target = matching[0];
      state.correct += 1;
      updateHud();
      removeLetter(target);
    }

    window.pageConfig = {
      pageId: 'alphabetRain',
      title: 'Alphabet Rain',
      about: 'Type lowercase letters to clear the falling stream.',
      siteRoot: '../../',
      exitTarget: 'home',
      currentDirectory: 'root',
      promptSelector: '#shell',
      promptPrefix: '> ',
      echoCommands: false,
      silentErrors: true,
      onKey(key) {
        const normalized = String(key).toLowerCase();
        if (normalized === 'escape') {
          if (state.paused) {
            exitGame();
            return true;
          }
          if (state.started && !state.paused) {
            pauseGame();
            return true;
          }
          return true;
        }
        if (normalized === ' ' || normalized === 'space') {
          if (!state.started) {
            startGame();
            return true;
          }
          if (state.paused) {
            resumeGame();
            return true;
          }
          return true;
        }
        if (/^[a-z]$/.test(normalized)) {
          if (!state.started) {
            startGame();
            handleTypedLetter(normalized);
            return true;
          }
          if (state.paused) {
            resumeGame();
            return true;
          }
          handleTypedLetter(normalized);
          return true;
        }
        return false;
      },
      onScreenKey({ key, closeScreen: closeOverlay }) {
        if (key === 'escape') {
          if (state.paused || state.started) {
            exitGame();
            return true;
          }
          return true;
        }
        if (key === ' ' || key === 'space') {
          if (!state.started) {
            startGame();
            closeOverlay();
            return true;
          }
          if (state.paused) {
            resumeGame();
            closeOverlay();
            return true;
          }
          closeOverlay();
          return true;
        }
        if (/^[a-z]$/.test(key)) {
          if (!state.started) {
            startGame();
            handleTypedLetter(key);
            closeOverlay();
            return true;
          }
          if (state.paused) {
            resumeGame();
            closeOverlay();
            return true;
          }
          handleTypedLetter(key);
          closeOverlay();
          return true;
        }
        return false;
      }
    };

    window.addEventListener('resize', () => {
      setKeyboardOffset();
    });

    setKeyboardOffset();
    updateHud();
    window.addEventListener('load', () => {
      if (!state.started && !state.paused) {
        openStartScreen();
      }
    }, { once: true });
    requestAnimationFrame(tick);
  </script>
  <script src="../../js/input.js"></script>
</body>
</html>
