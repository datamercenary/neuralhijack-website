name: Static validation

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f js/input.js
          test -f js/site-map.js
          if grep -R -n 'href="/' --include='*.html' .; then
            echo 'Site-relative navigation must not start with /'
            exit 1
          fi
