<script>

function interpColors(ar, ag, ab, br, bg, bb, a) {
  return 'rgba(' + Math.round(a * ar + (1 - a) * br) + ', ' + Math.round(a * ag + (1 - a) * bg) + ', ' + Math.round(a * ab + (1 - a) * bb) + ', ' + a + ')';
}

const score = [];

class Question {
  constructor(i, j, el) {
    this.i = i;
    this.j = j;
    this.el = el;
    this.n_right = 1;
    this.n_wrong = 1;
    this.max_info = 8;
  }

  getQuestionText () {
    return this.i + ' + ' + this.j + ' = ';
  }

  isCorrect (value) { return value == this.i + this.j; }

  checkAnswer (value) {
    let correct = this.isCorrect(value);
    if (correct) {
      this.n_right += 1;
      score[0] += 1;
    } else {
      this.n_wrong += 1;
      score[1] += 1;
    }
    if ((this.n_right + this.n_wrong) > this.max_info) {
      if (this.n_wrong > 0) {
        this.n_wrong -= 1;
      } else {
        this.n_right -= 1;
      }
    }
    this.setColor()
    console.log(score);
  }

  setColor () {
    let newAlpha = (this.n_right - this.n_wrong) / Math.max(this.n_right, this.n_wrong);
    let color = "";
    if ((this.n_right - this.n_wrong) > 0) {
        color = interpColors(112, 120, 212, 147, 209, 189, newAlpha);
    } else if ((this.n_right - this.n_wrong) < 0) {
        color = interpColors(212, 112, 112, 147, 209, 189, -newAlpha);
    } else {
        color = "rgba(147, 209, 189, 0.6)";
    }
    this.el.style.backgroundColor = color;
  }
}

const minMultiplicand = 0;
const maxMultiplicand = 6;
const grid = [];
const lattice = document.getElementById("lattice");
const typingSpeed = 12;
const shell = document.getElementById('shell');
const cursor = shell.lastElementChild.lastElementChild;
const currentQuestion = [];

function getPrompt() {
  return shell.lastElementChild.firstElementChild.nextElementSibling;
}

function input(k) {
  let prompt = getPrompt()
  const allowed = "1234567890"
  if (k === "Backspace") {
    // Remove last character
    let text = prompt.innerText;
    prompt.innerText = text.slice(0, -1);
  } else if (k === "Enter") {
    if (prompt.innerText.length > 0) {
      const newline = document.createElement('p');
      newline.appendChild(document.createElement('span'));
      newline.lastElementChild.innerText = '> ';
      newline.appendChild(document.createElement('span'));
      newline.appendChild(cursor);
      shell.appendChild(newline);
      if (shell.childElementCount > 6) {
        shell.removeChild(shell.firstElementChild);
      }
      submit(prompt.innerText);
    } else {
      console.log("prompt innerText is empty")
    }
  } else if (k === 'Escape') {
    window.location.replace('../../index.html'); 
  } else if (k.length === 1 && allowed.indexOf(k) > -1) {
    // Regular printable characters (letters, numbers, symbols)
    prompt.innerText += k;
  };
};

for (let i = 0; i < (maxMultiplicand - minMultiplicand + 1); i++) {
  const row = document.createElement("div");
  const line = [];
  row.classList.add("row");
  for (let j = 0; j < (maxMultiplicand - minMultiplicand + 1); j++) {
    const sq = document.createElement("div");
    sq.classList.add("sq")
    line.push(new Question(minMultiplicand + i, minMultiplicand + j, sq))
//      line.push([10, 10, sq, minMultiplicand + row, minMultiplicand + col])
    row.appendChild(sq);
  }
  grid.push(line)
  lattice.appendChild(row);
}

function typeQuestion(text) {
  shell.lastElementChild.firstElementChild.innerText += text.charAt(0);
  if (text.length > 0) {
    setTimeout(typeQuestion, typingSpeed, text.slice(1, text.length));
  } else if (shell.lastElementChild.firstElementChild.innerText.slice(-1) != ' ') {
    shell.lastElementChild.firstElementChild.innerText += ' ';
  }
}

function askQuestion() {
  let i = Math.floor(Math.random() * (maxMultiplicand - minMultiplicand + 1));
  let j = Math.floor(Math.random() * (maxMultiplicand - minMultiplicand + 1));
  currentQuestion[0] = grid[i][j];
  typeQuestion(currentQuestion[0].getQuestionText());
}

function conclude() {
  let prompt = getPrompt();
  currentInputValue = prompt.innerText;
  console.log('current value: ' + currentInputValue);
  if (currentInputValue.length === 0 ) {
    console.log('inner text is empty');
    currentQuestion.pop();
    prompt.innerText = '-';
    input('Enter')
  } else {
    if (currentQuestion[0].isCorrect(currentInputValue)) {
      currentQuestion[0].checkAnswer(currentInputValue);
    }
    currentQuestion.pop();
    prompt.innerText += '-';
    input('Enter');
  }
  prompt = getPrompt();
  typeQuestion('Finished with a score of ' + score[0] + ' / ' + (score[0] + score[1]) + " or");
  prompt.innerText = (Math.round(1000 * score[0] / (score[0] + score[1])) / 10) + "%";
  score.pop();
  score.pop();
  setTimeout(input, 500, 'Enter');
  setTimeout(typeQuestion, 550, 'Try again (1 = yes / 0 = no)?')
}

function submit(text) {
  if (currentQuestion.length === 0) {
    if (text === 'clear' || text === 'cls') {
      const shell = document.getElementById('shell');
    
      while (shell.lastChild && shell.lastChild !== shell.firstElementChild) {
        shell.removeChild(shell.firstChild);
      }
    } else if (text === '0' || text === 'n') {
      window.location.replace('../../index.html');
    } else if (text === '1') {
      // start
      score.push(0);
      score.push(0);
      askQuestion();
      setTimeout(conclude, 30000)
    }
  } else {
    currentQuestion[0].checkAnswer(text);
    askQuestion()
  }
};

$(document).ready(function () {
  $(document).on('keydown', function (e) { 
    e.preventDefault();
    input(e.key);
  });
});
