<!DOCTYPE html>
<html>
<head>
    <title>Addition Facts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<link rel="icon" href="../favicon.svg" type="image/x-icon">
<style>

    svg {
    font-family: "Share Tech Mono", monospace;
    font-weight: 400;
    font-style: normal;
  }

  .key {
    display: inline-block;
  }
</style>
</head>
<body style="background-color: rgb(44, 43, 43);">
<div>
    <svg id="view" width="100%" height="100%" background-color="#444">
    </svg>
</div>
</body>
<script>
    var data = [{key: '1', x: 10, y: 10},
                {key: '2', x: 10, y: 10},
                {key: '3', x: 10, y: 10},
                {key: '4', x: 10, y: 10},
                {key: '5', x: 10, y: 10},
                {key: '6', x: 10, y: 10},
                {key: '6', x: 10, y: 10},
                {key: '6', x: 10, y: 10},
                {key: '6', x: 10, y: 10},
                {key: '6', x: 10, y: 10},
                {key: '6', x: 10, y: 10},
        ];
        
    var y = d3.scaleLinear().domain(d3.extent(data, d => d.amount)).range([500, 0]);
    var x = d3.scaleTime().domain([new Date(Date.parse(d3.min(data, d => d.amount))),
                                   new Date(Date.parse(d3.max(data, d => d.amount)))
                                  ]).range([0, 800]);

    var xAxis = d3.axisBottom(x).ticks(4),
        yAxis = d3.axisLeft(y).ticks(5),
        svg = d3.select('#view');

</script>
</html>
