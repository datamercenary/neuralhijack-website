<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SVG Numberpad</title>
  <style>
    :root{
      --gap:12px;
      --key-size:80px;
      --radius:10px;
      --bg:#0f172a;
      --key-bg:#e6f0ff;
      --key-shadow: rgba(0,0,0,0.15);
      --accent:#2563eb;
      --text:#071025;
      --muted:#94a3b8;
    }
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
    body{display:grid;place-items:center;background:linear-gradient(180deg,#071330 0%, #0b2240 100%);padding:24px;color:var(--key-bg)}

    .container{background:rgba(255,255,255,0.03);padding:18px;border-radius:12px;box-shadow:0 6px 20px rgba(2,6,23,0.6);width:min(420px,96vw)}

    .display{height:52px;background:rgba(255,255,255,0.03);border-radius:8px;padding:8px 12px;display:flex;align-items:center;justify-content:flex-end;font-size:20px;color:var(--key-bg);box-sizing:border-box;margin-bottom:14px}

    /* numpad grid */
    .numpad{display:grid;grid-template-columns:repeat(3, 1fr);grid-auto-rows:var(--key-size);gap:var(--gap);}

    /* each key lives inside its own div (requirement) */
    .key{display:block;user-select:none;cursor:pointer}
    .key svg{width:100%;height:100%;display:block}

    rect.key-rect{fill:var(--key-bg);rx:var(--radius);ry:var(--radius);stroke:transparent;filter:drop-shadow(0 4px 8px var(--key-shadow));}
    text.key-label{font-size:36px;font-weight:600;fill:var(--text);dominant-baseline:middle;text-anchor:middle}

    /* special keys styling */
    .key[data-key="Enter"] rect.key-rect{fill:#d1fae5}
    .key[data-key="Backspace"] rect.key-rect{fill:#fee2e2}
    .key[data-key="Enter"] text.key-label{font-size:20px}
    .key[data-key="Backspace"] text.key-label{font-size:20px}

    .key:active rect.key-rect{transform:translateY(2px);filter:drop-shadow(0 2px 4px rgba(0,0,0,0.18));}

    /* focus outline for keyboard users */
    .key:focus{outline:none}
    .key:focus-visible rect.key-rect{stroke:var(--accent);stroke-width:3}

    /* wide Enter key — place it in the last column to span 3 rows visually */
    .key.enter{grid-column:3;grid-row:2 / span 2}
    .key.zero{grid-column:1 / span 2}

    /* mobile tweaks */
    @media (max-width:380px){
      :root{--key-size:68px}
      text.key-label{font-size:30px}
    }
  </style>
</head>
<body>
  <div class="container" role="application" aria-label="SVG numberpad example">
    <div id="display" class="display" aria-live="polite" aria-atomic="true">&nbsp;</div>

    <div class="numpad" id="numpad">
      <!-- Row 1 -->
      <div class="key" data-key="1" tabindex="0">
        <svg viewBox="0 0 100 100" role="button" aria-label="1">
          <g>
            <rect class="key-rect" x="4" y="4" width="92" height="92" rx="10" ry="10"></rect>
            <text class="key-label" x="50" y="53">1</text>
          </g>
        </svg>
      </div>

      <div class="key" data-key="2" tabindex="0">
        <svg viewBox="0 0 100 100" role="button" aria-label="2">
          <g>
            <rect class="key-rect" x="4" y="4" width="92" height="92" rx="10" ry="10"></rect>
            <text class="key-label" x="50" y="53">2</text>
          </g>
        </svg>
      </div>

      <div class="key" data-key="3" tabindex="0">
        <svg viewBox="0 0 100 100" role="button" aria-label="3">
          <g>
            <rect class="key-rect" x="4" y="4" width="92" height="92" rx="10" ry="10"></rect>
            <text class="key-label" x="50" y="53">3</text>
          </g>
        </svg>
      </div>

      <!-- Row 2 -->
      <div class="key" data-key="4" tabindex="0">
        <svg viewBox="0 0 100 100" role="button" aria-label="4">
          <g>
            <rect class="key-rect" x="4" y="4" width="92" height="92" rx="10" ry="10"></rect>
            <text class="key-label" x="50" y="53">4</text>
          </g>
        </svg>
      </div>

      <div class="key" data-key="5" tabindex="0">
        <svg viewBox="0 0 100 100" role="button" aria-label="5">
          <g>
            <rect class="key-rect" x="4" y="4" width="92" height="92" rx="10" ry="10"></rect>
            <text class="key-label" x="50" y="53">5</text>
          </g>
        </svg>
      </div>

      <div class="key enter" data-key="Enter" tabindex="0">
        <svg viewBox="0 0 100 200" preserveAspectRatio="none" role="button" aria-label="Enter">
          <g>
            <rect class="key-rect" x="4" y="4" width="92" height="192" rx="10" ry="10"></rect>
            <text class="key-label" x="50" y="100">Enter</text>
          </g>
        </svg>
      </div>

      <!-- Row 3 -->
      <div class="key" data-key="6" tabindex="0">
        <svg viewBox="0 0 100 100" role="button" aria-label="6">
          <g>
            <rect class="key-rect" x="4" y="4" width="92" height="92" rx="10" ry="10"></rect>
            <text class="key-label" x="50" y="53">6</text>
          </g>
        </svg>
      </div>

      <div class="key" data-key="7" tabindex="0">
        <svg viewBox="0 0 100 100" role="button" aria-label="7">
          <g>
            <rect class="key-rect" x="4" y="4" width="92" height="92" rx="10" ry="10"></rect>
            <text class="key-label" x="50" y="53">7</text>
          </g>
        </svg>
      </div>

      <div class="key" data-key="8" tabindex="0">
        <svg viewBox="0 0 100 100" role="button" aria-label="8">
          <g>
            <rect class="key-rect" x="4" y="4" width="92" height="92" rx="10" ry="10"></rect>
            <text class="key-label" x="50" y="53">8</text>
          </g>
        </svg>
      </div>

      <!-- Row 4 -->
      <div class="key" data-key="9" tabindex="0">
        <svg viewBox="0 0 100 100" role="button" aria-label="9">
          <g>
            <rect class="key-rect" x="4" y="4" width="92" height="92" rx="10" ry="10"></rect>
            <text class="key-label" x="50" y="53">9</text>
          </g>
        </svg>
      </div>

      <div class="key zero" data-key="0" tabindex="0">
        <svg viewBox="0 0 100 100" role="button" aria-label="0">
          <g>
            <rect class="key-rect" x="4" y="4" width="92" height="92" rx="10" ry="10"></rect>
            <text class="key-label" x="50" y="53">0</text>
          </g>
        </svg>
      </div>

      <div class="key" data-key="Backspace" tabindex="0">
        <svg viewBox="0 0 100 100" role="button" aria-label="Backspace">
          <g>
            <rect class="key-rect" x="4" y="4" width="92" height="92" rx="10" ry="10"></rect>
            <text class="key-label" x="50" y="50">⌫</text>
          </g>
        </svg>
      </div>

    </div>
  </div>

  <script>
    (function(){
      const display = document.getElementById('display');
      const keys = Array.from(document.querySelectorAll('.key'));

      function updateDisplay(text){
        display.textContent = text === '' ? '\u00A0' : text;
      }

      let value = '';
      function handleKey(key){
        if(key === 'Backspace'){
          value = value.slice(0, -1);
        } else if(key === 'Enter'){
          // For demo: flash the entered value and then clear
          const previous = value;
          updateDisplay('Submitted: ' + (previous || '[empty]'));
          setTimeout(()=>{ value = ''; updateDisplay(value); }, 800);
          return;
        } else if(/^[0-9]$/.test(key)){
          value += key;
        }
        updateDisplay(value);
      }

      // Attach click and keyboard handlers to each key div (each key is inside its own div)
      keys.forEach(k => {
        k.addEventListener('click', () => handleKey(k.dataset.key));

        // allow Enter/Space to 'press' the key when focused
        k.addEventListener('keydown', (ev) => {
          if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); k.classList.add('active'); handleKey(k.dataset.key); setTimeout(()=>k.classList.remove('active'),120);} 
        });
      });

      // global keyboard mapping
      window.addEventListener('keydown', (ev)=>{
        if(ev.key >= '0' && ev.key <= '9'){
          handleKey(ev.key);
          ev.preventDefault();
        } else if(ev.key === 'Backspace'){
          handleKey('Backspace');
          ev.preventDefault();
        } else if(ev.key === 'Enter'){
          handleKey('Enter');
          ev.preventDefault();
        }
      });

      // initialize
      updateDisplay('');
    })();
  </script>
</body>
</html>
