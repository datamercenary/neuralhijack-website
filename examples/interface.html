  transition: transform 0.1s, background 0.1s;

<script>

function input(k) {
    console.log(k);
}

function makeKey(newKey, width=50, height=50, rx=8, ry=8, offset=55) {
    const kdiv = document.createElement('div');
    kdiv.classList = 'key-anchor';
    const ksvg = kdiv.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'svg'));
    ksvg.style.width = width;
    ksvg.style.height = height;
    const kdefs = ksvg.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'defs'));
    const kmask = kdefs.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'mask'));
    kmask.id = "maskCutout" + newKey;
    const maskr = kmask.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'rect'));
    maskr.setAttribute("fill", 'white');
    maskr.setAttribute("x", '0');
    maskr.setAttribute("y", '0');
    maskr.setAttribute("width", '100%');
    maskr.setAttribute("height", '100%');
    const maskt = kmask.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'text'));
    maskt.setAttribute('x', "50%");
    maskt.setAttribute('y', offset + "%");
    maskt.setAttribute('fill', "black");
    maskt.setAttribute('text-anchor', "middle");
    maskt.setAttribute('dominant-baseline', "middle");
    maskt.setAttribute('font-size', "2em"); 
    maskt.innerHTML = newKey;
    const krect = ksvg.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'rect'));
    krect.style.fill = '#93d1b6';
    krect.style.rx = rx;
    krect.style.ry = ry;
    krect.style.x = '0';
    krect.style.y = '0';
    krect.style.width = width;
    krect.style.height = height;
    krect.setAttribute('mask', "url(#" + kmask.id + ")");
    return kdiv;
}

const numpad = document.getElementById('numpad');
numpad.appendChild(makeKey('E', '20%', '50%'));
numpad.lastElementChild.left = '0%';
numpad.lastElementChild.top = '0%';

for (r=0; r<3; r++) {
    for (c=0; c<3; c++) {
        const ky = makeKey((1 + c + 3*r), '20%', '25%');
        ky.left = (20 + 20*c) + '%';
        ky.top = (25 * r) + '%';
    }
}
