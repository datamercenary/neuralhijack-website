<!DOCTYPE html>
<html>
<head>
    <title>Addition Facts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link rel="icon" href="../favicon.svg" type="image/x-icon">
<style>

    svg {
    font-family: "Share Tech Mono", monospace;
    font-weight: 400;
    font-style: normal;
  }

  .key {
    display: inline-block;
  }
</style>
</head>
<body style="background-color: rgb(44, 43, 43);">
<div class="key" onclick="console.log('1 was clicked!');">
    <svg width="50" height="50">
        <defs>
        <mask id="textCutoutMask1">
            <!-- Everything within the mask that is white will be visible -->
            <rect x="0" y="0" width="100%" height="100%" fill="white" />
            <!-- The text will be black, effectively "cutting out" the area -->
            <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-size="2em" fill="black">1</text>
        </mask>
        </defs>
        <rect x="10" y="5" width="50" height="50" rx="12" ry="12" fill="#93d1b6" mask="url(#textCutoutMask1)"/> 
    </svg>
</div>
<div class="key" onclick="console.log('2 was clicked!');">
    <svg width="50" height="50">
        <defs>
        <mask id="textCutoutMask2">
            <!-- Everything within the mask that is white will be visible -->
            <rect x="0" y="0" width="100%" height="100%" fill="white" />
            <!-- The text will be black, effectively "cutting out" the area -->
            <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-size="2em" fill="black">2</text>
        </mask>
        </defs>
        <rect x="0" y="0" width="50" height="50" fill="transparent"/>
        <rect x="10" y="5" width="50" height="50" rx="12" ry="12" fill="#93d1b6" mask="url(#textCutoutMask2)"/> 

    </svg>
</div>
<div class="key" onclick="console.log('3 was clicked!');">
    <svg width="50" height="50">
        <defs>
        <mask id="textCutoutMask3">
            <!-- Everything within the mask that is white will be visible -->
            <rect x="0" y="0" width="100%" height="100%" fill="white" />
            <!-- The text will be black, effectively "cutting out" the area -->
            <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-size="2em" fill="black">3</text>
        </mask>
        </defs>
        <rect x="0" y="0" width="50" height="50" fill="transparent"/>
        <rect x="10" y="5" width="50" height="50" rx="12" ry="12" fill="#93d1b6" mask="url(#textCutoutMask3)"/> 

    </svg>
</div>
</body>
</html>
